<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Diagrama de estados del proceso (PCB). Regenerar el PNG con: docs/generar_documentos.sh -->
  <defs>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/>
    </marker>
    <marker id="rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A3A"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C8D40"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#FFFFFF"/>

  <!-- Estados -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <rect x="135" y="20"  width="270" height="54" rx="12" fill="#F4F6F8" stroke="#5B6770" stroke-width="2"/>
    <text x="270" y="53">NEW (NUEVO)</text>

    <rect x="135" y="170" width="270" height="54" rx="12" fill="#E3F0FB" stroke="#2F6EA5" stroke-width="2"/>
    <text x="270" y="203">READY (LISTO)</text>

    <rect x="135" y="340" width="270" height="54" rx="12" fill="#FDF0E1" stroke="#C27A1B" stroke-width="2"/>
    <text x="270" y="373">RUNNING (EJECUCIÓN)</text>

    <rect x="135" y="485" width="270" height="54" rx="12" fill="#EAF5EA" stroke="#3C8D40" stroke-width="2"/>
    <text x="270" y="518" font-size="15">TERMINATED (FINALIZADO)</text>

    <rect x="610" y="248" width="260" height="68" rx="12" fill="#FBE3E3" stroke="#B03A3A" stroke-width="2"/>
    <text x="740" y="277">BLOCKED</text>
    <text x="740" y="301" font-size="14">(PAUSADO / BLOQUEADO)</text>
  </g>

  <g font-size="14" fill="#33393E">
    <!-- NEW -> READY -->
    <line x1="270" y1="74" x2="270" y2="168" stroke="#5B6770" stroke-width="2" marker-end="url(#gris)"/>
    <text x="282" y="118">llegada</text>
    <text x="282" y="136" font-size="12.5">(create / arrival_time)</text>

    <!-- READY -> RUNNING (despacho) -->
    <line x1="300" y1="224" x2="300" y2="338" stroke="#5B6770" stroke-width="2" marker-end="url(#gris)"/>
    <text x="312" y="262">despacho</text>
    <text x="312" y="280" font-size="12.5">RR: frente de la cola</text>
    <text x="312" y="297" font-size="12.5">SRTF: menor ráfaga restante</text>

    <!-- RUNNING -> READY (desalojo) -->
    <line x1="230" y1="340" x2="230" y2="226" stroke="#5B6770" stroke-width="2" marker-end="url(#gris)"/>
    <text x="218" y="270" text-anchor="end">quantum agotado (RR)</text>
    <text x="218" y="288" text-anchor="end">desalojo (SRTF)</text>

    <!-- RUNNING -> TERMINATED -->
    <line x1="270" y1="394" x2="270" y2="483" stroke="#5B6770" stroke-width="2" marker-end="url(#gris)"/>
    <text x="282" y="444">ráfaga restante = 0</text>
  </g>

  <g font-size="14" font-weight="bold">
    <!-- READY -> BLOCKED (block) -->
    <path d="M405,185 C520,185 600,215 640,246" fill="none" stroke="#B03A3A" stroke-width="2" marker-end="url(#rojo)"/>
    <text x="500" y="178" fill="#B03A3A">block</text>

    <!-- BLOCKED -> READY (unblock) -->
    <path d="M612,282 C540,282 470,215 407,212" fill="none" stroke="#3C8D40" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#verde)"/>
    <text x="498" y="240" fill="#3C8D40">unblock</text>

    <!-- RUNNING -> BLOCKED (block) -->
    <path d="M405,367 C560,367 700,360 735,318" fill="none" stroke="#B03A3A" stroke-width="2" marker-end="url(#rojo)"/>
    <text x="560" y="390" fill="#B03A3A">block</text>
  </g>
</svg>
